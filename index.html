<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Readiness Coach — Ivy Tech</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">

  <!-- ══ TOP BAR ══════════════════════════════════════════════ -->
  <header class="top-bar">
    <div class="top-bar-brand">
      <div class="brand-dot">🎓</div>
      Academic Readiness Coach
    </div>
    <div class="top-bar-right">
      <span class="date-chip" id="today-date"></span>
    </div>
  </header>

  <!-- ══ SIDEBAR ══════════════════════════════════════════════ -->
  <nav class="sidebar">
    <div class="nav-section-label">Students</div>
    <div id="student-nav"></div>

    <div class="nav-section-label">Curriculum Week</div>
    <div class="week-pill-wrap" id="week-nav"></div>
  </nav>

  <!-- ══ MAIN CONTENT ════════════════════════════════════════ -->
  <main class="main-content">

    <!-- Stat row -->
    <div class="stat-row" id="stat-row"></div>

    <!-- Today card -->
    <div class="today-card" id="today-card"></div>

    <!-- Motivational message -->
    <div class="motive" id="motive-banner"></div>

    <!-- Two-column body -->
    <div class="content-grid">

      <!-- LEFT: calendar + sessions -->
      <div>
        <div class="card">
          <div class="card-hd">
            <div class="card-hd-icon card-hd-icon--cal">📅</div>
            <span class="card-title">Weekly Calendar</span>
          </div>
          <div id="cal-wrap"></div>
        </div>

        <div class="card">
          <div class="card-hd">
            <div class="card-hd-icon card-hd-icon--check">✅</div>
            <span class="card-title">Study Sessions</span>
          </div>
          <div id="sessions-list"></div>
        </div>
      </div>

      <!-- RIGHT: deadlines + scores + resources -->
      <div>
        <div class="card">
          <div class="card-hd">
            <div class="card-hd-icon card-hd-icon--dead">⏰</div>
            <span class="card-title">Upcoming Deadlines</span>
          </div>
          <div id="deadlines-list"></div>
        </div>

        <div class="card">
          <div class="card-hd">
            <div class="card-hd-icon card-hd-icon--score">📊</div>
            <span class="card-title">Diagnostic Scores</span>
          </div>
          <div id="topic-scores"></div>
        </div>

        <div class="card">
          <div class="card-hd">
            <div class="card-hd-icon card-hd-icon--res">🎓</div>
            <span class="card-title">Support Resources</span>
          </div>
          <div id="resources-list"></div>
        </div>
      </div>

    </div><!-- /content-grid -->

  </main>

  <!-- ══ FOOTER ════════════════════════════════════════════════ -->
  <footer class="app-footer">
    Ivy Tech IT Challenge 2026 · Academic Readiness Coach · Prototype — sample data only
  </footer>

</div><!-- /app-shell -->

<!-- Data -->
<script src="data/case_data.js"></script>

<!-- Modules (order matters) -->
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/analysis.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/resources.js"></script>
<script src="js/persistence.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
