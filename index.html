<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Readiness Coach — Ivy Tech</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">

  <!-- ══ TOP BAR ══ -->
  <header class="top-bar">
    <div class="top-bar-brand">🎓 Academic Readiness <span>Coach</span></div>
    <div class="top-bar-right">
      <span class="today-badge" id="today-date"></span>
    </div>
  </header>

  <!-- ══ SIDEBAR ══ -->
  <nav class="sidebar">
    <div class="sidebar-label">Students</div>
    <div id="student-nav"></div>

    <div class="sidebar-label" style="margin-top:24px">Curriculum Week</div>
    <div class="week-nav" id="week-nav"></div>
  </nav>

  <!-- ══ MAIN CONTENT ══ -->
  <main class="main-content">

    <!-- Stat cards row -->
    <div class="dash-row" id="stat-cards"></div>

    <!-- TODAY recommendation banner -->
    <div class="today-rec" id="today-rec"></div>

    <!-- Motivational message -->
    <div class="motive-banner" id="motive-banner"></div>

    <!-- Two-column: Calendar (left wide) + Right panel -->
    <div class="content-grid">

      <!-- LEFT: weekly calendar -->
      <div>
        <div class="card">
          <div class="card-title">📅 Weekly Calendar</div>
          <div id="cal-wrap" style="overflow-x:auto"></div>
        </div>

        <!-- Study sessions checklist -->
        <div class="card">
          <div class="card-title">✅ Your Study Sessions</div>
          <div id="sessions-list"></div>
        </div>
      </div>

      <!-- RIGHT: deadlines + scores + resources -->
      <div>

        <!-- Upcoming deadlines -->
        <div class="card">
          <div class="card-title">⏰ Upcoming Deadlines</div>
          <div id="deadlines-list"></div>
        </div>

        <!-- Topic diagnostic scores -->
        <div class="card">
          <div class="card-title">📊 Diagnostic Scores</div>
          <div id="topic-scores"></div>
        </div>

        <!-- Support resources -->
        <div class="card">
          <div class="card-title">🎓 Support Resources</div>
          <div id="resources-list"></div>
        </div>

      </div>
    </div>

  </main>

  <!-- ══ FOOTER ══ -->
  <footer class="app-footer">
    Ivy Tech IT Challenge 2026 · Academic Readiness Coach · Prototype — sample data only, no real student records
  </footer>

</div>

<!-- Data -->
<script src="data/case_data.js"></script>

<!-- Modules (order matters) -->
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/analysis.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/resources.js"></script>
<script src="js/persistence.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
